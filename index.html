<title>MFMS Demo</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
/>
<style>
  /* Layout: dark-green sidebar shell + light working canvas; mobile screens shown inside phone frames */
  :root {
    --bg: #f2f5f1;
    --surface: #ffffff;
    --surface-2: #ebf0ea;
    --line: #dae2d9;
    --fg: #14211b;
    --muted: #5b6b62;
    --primary: #1c5a44;
    --primary-ink: #ffffff;
    --primary-soft: #dfede5;
    --accent: #d88a1c;
    --accent-soft: #fbedd5;
    --ok: #2c8553;
    --ok-soft: #ddf1e4;
    --warn: #b9740f;
    --warn-soft: #fbebcf;
    --bad: #be3b35;
    --bad-soft: #f9dedc;
    --info: #2d6aa3;
    --info-soft: #ddeaf6;
    --side: #112d25;
    --side-fg: #c9dad1;
    --side-active: #1e4a3b;
    --side-strong: #ffffff;
    --shadow:
      0 1px 2px rgba(20, 40, 30, 0.06), 0 4px 16px rgba(20, 40, 30, 0.05);
    --font:
      "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1613;
      --surface: #15201b;
      --surface-2: #1b2923;
      --line: #2a3a33;
      --fg: #e4ede8;
      --muted: #93a49a;
      --primary: #5dbf95;
      --primary-ink: #0a1913;
      --primary-soft: #1e3a2f;
      --accent: #efaa45;
      --accent-soft: #3a2d17;
      --ok: #4ec384;
      --ok-soft: #173527;
      --warn: #e9a43e;
      --warn-soft: #3a2c14;
      --bad: #ee6b61;
      --bad-soft: #3c1d1b;
      --info: #6ea9e0;
      --info-soft: #1a2e42;
      --side: #0a130f;
      --side-fg: #a9bdb2;
      --side-active: #183a2e;
      --side-strong: #ffffff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1613;
    --surface: #15201b;
    --surface-2: #1b2923;
    --line: #2a3a33;
    --fg: #e4ede8;
    --muted: #93a49a;
    --primary: #5dbf95;
    --primary-ink: #0a1913;
    --primary-soft: #1e3a2f;
    --accent: #efaa45;
    --accent-soft: #3a2d17;
    --ok: #4ec384;
    --ok-soft: #173527;
    --warn: #e9a43e;
    --warn-soft: #3a2c14;
    --bad: #ee6b61;
    --bad-soft: #3c1d1b;
    --info: #6ea9e0;
    --info-soft: #1a2e42;
    --side: #0a130f;
    --side-fg: #a9bdb2;
    --side-active: #183a2e;
    --side-strong: #ffffff;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }
  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
  }
  button,
  input,
  select,
  textarea {
    font: inherit;
    color: inherit;
  }
  button {
    cursor: pointer;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  h1,
  h2,
  h3 {
    margin: 0;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  .mono {
    font-family: var(--mono);
    font-size: 0.92em;
  }
  .num {
    font-variant-numeric: tabular-nums;
  }
  .muted {
    color: var(--muted);
  }
  svg.i {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
  }

  /* Shell */
  .app {
    display: grid;
    grid-template-columns: 252px minmax(0, 1fr);
    min-height: 100%;
  }
  .side {
    background: var(--side);
    color: var(--side-fg);
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    padding: 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 8px;
    color: var(--side-strong);
  }
  .brand .logo {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: #e7a23b;
    display: grid;
    place-items: center;
  }
  .brand .logo svg {
    width: 32px;
    height: 32px;
  }
  .brand b {
    font-size: 18px;
    letter-spacing: 0.04em;
    display: block;
    line-height: 1.1;
  }
  .brand small {
    font-size: 11px;
    color: var(--side-fg);
    opacity: 0.8;
  }
  .nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .nav .grp {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.55;
    padding: 12px 10px 4px;
  }
  .nav a {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 10px;
    border-radius: 9px;
    color: var(--side-fg);
    text-decoration: none;
    font-weight: 500;
    font-size: 13.5px;
  }
  .nav a:hover {
    background: rgba(255, 255, 255, 0.05);
    color: var(--side-strong);
  }
  .nav a.on {
    background: var(--side-active);
    color: var(--side-strong);
  }
  .nav a.on svg {
    color: #e7a23b;
  }
  .nav a .cnt {
    margin-left: auto;
    font-size: 11px;
    background: #e7a23b;
    color: #2a1a05;
    border-radius: 99px;
    padding: 0 7px;
    font-weight: 700;
  }
  .side-foot {
    margin-top: auto;
    font-size: 12px;
    padding: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .side-foot .av {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #2b5b49;
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 12px;
  }
  .side-foot b {
    color: var(--side-strong);
    display: block;
    font-size: 13px;
  }
  .side-foot button {
    margin-left: auto;
    background: none;
    border: 0;
    color: var(--side-fg);
    padding: 6px;
    border-radius: 8px;
  }
  .side-foot button:hover {
    background: rgba(255, 255, 255, 0.08);
  }

  .main {
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding-block: 12px;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    display: flex;
    align-items: center;
    gap: 12px;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--bg);
  }
  .burger {
    display: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px;
  }
  .gsearch {
    flex: 1;
    max-width: 460px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 0 12px;
    color: var(--muted);
  }
  .gsearch input {
    flex: 1;
    border: 0;
    background: none;
    padding: 9px 0;
    outline: none;
    color: var(--fg);
    min-width: 0;
  }
  .gsearch kbd {
    font-family: var(--mono);
    font-size: 11px;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 0 5px;
  }
  .top .sp {
    flex: 1;
  }
  .pill-demo {
    font-size: 11.5px;
    font-weight: 600;
    background: var(--accent-soft);
    color: var(--warn);
    padding: 4px 10px;
    border-radius: 99px;
    white-space: nowrap;
  }
  .iconbtn {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px;
    display: grid;
    place-items: center;
    color: var(--fg);
  }
  .iconbtn .dot {
    position: absolute;
    top: 5px;
    right: 6px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--bad);
    border: 2px solid var(--surface);
  }
  .content {
    padding-block: 22px 48px;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-width: 0;
  }
  .scrim {
    display: none;
  }

  @media (max-width: 980px) {
    .app {
      grid-template-columns: minmax(0, 1fr);
    }
    .side {
      position: fixed;
      inset: 0 auto 0 0;
      width: 272px;
      z-index: 60;
      transform: translateX(-105%);
      transition: transform 0.22s ease;
      padding-left: max(12px, env(safe-area-inset-left, 0px));
    }
    .side.open {
      transform: none;
    }
    .scrim.open {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 55;
    }
    .burger {
      display: grid;
    }
    .pill-demo {
      display: none;
    }
    .top,
    .content {
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    .gsearch kbd {
      display: none;
    }
  }

  /* Page header */
  .ph {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }
  .ph h1 {
    font-size: 24px;
    font-weight: 700;
  }
  .ph p {
    margin: 2px 0 0;
    color: var(--muted);
  }
  .ph .acts {
    margin-left: auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .crumb {
    font-size: 12.5px;
    color: var(--muted);
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 4px;
  }
  .crumb a {
    color: var(--muted);
    text-decoration: none;
  }
  .crumb a:hover {
    color: var(--primary);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border-radius: 10px;
    padding: 8px 14px;
    font-weight: 600;
    font-size: 13.5px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg);
    white-space: nowrap;
  }
  .btn:hover {
    border-color: var(--primary);
  }
  .btn.pri {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-ink);
  }
  .btn.pri:hover {
    filter: brightness(1.08);
  }
  .btn.sm {
    padding: 5px 10px;
    font-size: 12.5px;
    border-radius: 8px;
  }
  .btn.ghost {
    background: none;
    border-color: transparent;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .card-h {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px 0;
  }
  .card-h h3 {
    font-size: 15px;
    font-weight: 650;
  }
  .card-h .r {
    margin-left: auto;
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .card-b {
    padding: 14px 18px 18px;
  }
  .grid {
    display: grid;
    gap: 16px;
  }
  .g4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .g3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .g2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .g-dash {
    grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
  }
  @media (max-width: 1180px) {
    .g4 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .g3 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  @media (max-width: 860px) {
    .g-dash,
    .g2,
    .g3 {
      grid-template-columns: minmax(0, 1fr);
    }
  }
  @media (max-width: 520px) {
    .g4 {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  .kpi {
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .kpi .lb {
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .kpi .lb .ic {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    display: grid;
    place-items: center;
  }
  .kpi .v {
    font-size: 30px;
    font-weight: 750;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .kpi .s {
    font-size: 12.5px;
    color: var(--muted);
  }
  .kpi .s b {
    font-weight: 600;
  }
  .t-ok {
    color: var(--ok);
  }
  .t-bad {
    color: var(--bad);
  }
  .t-warn {
    color: var(--warn);
  }

  /* Chips */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 99px;
    padding: 2px 9px;
    white-space: nowrap;
  }
  .chip::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .chip.plain::before {
    display: none;
  }
  .c-ok {
    background: var(--ok-soft);
    color: var(--ok);
  }
  .c-warn {
    background: var(--warn-soft);
    color: var(--warn);
  }
  .c-bad {
    background: var(--bad-soft);
    color: var(--bad);
  }
  .c-info {
    background: var(--info-soft);
    color: var(--info);
  }
  .c-pri {
    background: var(--primary-soft);
    color: var(--primary);
  }
  .c-mut {
    background: var(--surface-2);
    color: var(--muted);
  }

  /* Tables */
  .tw {
    overflow-x: auto;
  }
  table.t {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  .t th {
    text-align: left;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    background: var(--surface-2);
  }
  .t td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
    white-space: nowrap;
  }
  .t tr:last-child td {
    border-bottom: 0;
  }
  .t tbody tr.click {
    cursor: pointer;
  }
  .t tbody tr.click:hover td {
    background: var(--surface-2);
  }
  .idc {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .av {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    flex: none;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .av svg {
    width: 100%;
    height: 100%;
  }
  .idc b {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 13px;
    display: block;
  }
  .idc small {
    color: var(--muted);
    font-size: 12px;
  }

  /* Filters */
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .inp,
  .sel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 7px 11px;
    outline: none;
    min-width: 0;
  }
  .inp:focus,
  .sel:focus {
    border-color: var(--primary);
  }
  .filters .inp {
    flex: 1 1 220px;
  }
  .seg {
    display: inline-flex;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
    flex-wrap: wrap;
  }
  .seg button {
    border: 0;
    background: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 12.5px;
    color: var(--muted);
  }
  .seg button.on {
    background: var(--surface);
    color: var(--fg);
    box-shadow: var(--shadow);
  }

  /* Bars */
  .bars {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .bar-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 4px 10px;
    font-size: 13px;
  }
  .bar-row .tr {
    grid-column: 1/-1;
    height: 9px;
    border-radius: 99px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .bar-row .tr i {
    display: block;
    height: 100%;
    border-radius: 99px;
  }
  .bar-row .vv {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .chart {
    width: 100%;
    height: auto;
    display: block;
  }
  .chart text {
    fill: var(--muted);
    font-size: 11px;
    font-family: var(--font);
  }
  .chart .gl {
    stroke: var(--line);
    stroke-width: 1;
  }
  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--muted);
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .legend i {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    display: inline-block;
  }

  /* Lists */
  .list {
    display: flex;
    flex-direction: column;
  }
  .li {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
  }
  .li:last-child {
    border-bottom: 0;
  }
  .li .ico {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    flex: none;
  }
  .li .tx {
    min-width: 0;
    flex: 1;
  }
  .li .tx b {
    font-weight: 600;
    display: block;
  }
  .li .tx small {
    color: var(--muted);
  }
  .li .rt {
    margin-left: auto;
    text-align: right;
    flex: none;
    font-size: 12px;
    color: var(--muted);
  }
  .task {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .task:last-child {
    border-bottom: 0;
  }
  .task input {
    width: 18px;
    height: 18px;
    accent-color: var(--primary);
  }
  .task.done span {
    text-decoration: line-through;
    color: var(--muted);
  }
  .task small {
    margin-left: auto;
    color: var(--muted);
    white-space: nowrap;
  }

  /* Cages */
  .area-h {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .area-h h2 {
    font-size: 16px;
  }
  .cages {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 12px;
  }
  .cage {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: left;
    border-top: 3px solid var(--line);

      let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;

  <div class="fld"><label for="n-b">Ngày sinh / ước tính</label><input class="inp" id="n-b" type="date" value="2022-05-10"></div>
  <div class="fld"><label for="n-w">Cân nặng (kg)</label><input class="inp" id="n-w" type="number" step="0.1" value="4.2"></div>
  <div class="fld full"><label for="n-o">Nguồn gốc</label><select class="sel" id="n-o"><option>Sinh tại trại</option>${ORIGINS.map((o) => `<option>${o}</option>`).join("")}</select></div>
  <div class="fld"><label for="n-c">Chuồng tiếp nhận</label><select class="sel" id="n-c">${cages
    .filter((c) => c.animals.length < c.cap)
    .map((c) => `<option>${c.id}</option>`)
    .join("")}</select></div>
  <div class="fld"><label for="n-chip">Số microchip</label><input class="inp" id="n-chip" placeholder="15 chữ số" value="981098012345678"></div>
  <div class="full muted" style="font-size:12.5px">Mã cá thể được cấp tự động: <b class="mono">MF${pad(animals.length + 1, 4)}</b>. Có thể nhập hàng loạt từ Excel.</div>`,
        `<button class="btn" data-act="close">Hủy</button><button class="btn pri" data-act="save-new">${ic("check")}Lưu hồ sơ</button>`,
      );
    }

    function nextCageId(k) {
      const nums = cages.filter((c) => c.area === k).map((c) => +c.id.slice(2));
      return `${k}-${pad((nums.length ? Math.max(...nums) : 0) + 1)}`;
    }
    function addCageModal() {
      const k = state.cageArea || "A";
      const ar = AREAS.find((a) => a.k === k);
      const TYPES = [
        "Chuồng tập thể",
        "Chuồng sinh sản",
        "Chuồng ghép đôi",
        "Chuồng cách ly đơn",
        "Chuồng hậu bị",
      ];
      return modal(
        "Thêm chuồng mới",
        `
  <div class="fld"><label for="c-area">Khu vực</label><select class="sel" id="c-area">${AREAS.map((a) => `<option value="${a.k}" ${a.k === k ? "selected" : ""}>${a.name} – ${a.desc}</option>`).join("")}</select></div>
  <div class="fld"><label for="c-id">Mã chuồng</label><input class="inp mono" id="c-id" value="${nextCageId(k)}" autocomplete="off"></div>
  <div class="fld"><label for="c-type">Loại chuồng</label><select class="sel" id="c-type">${TYPES.map((t) => `<option ${t === ar.type ? "selected" : ""}>${t}</option>`).join("")}</select></div>
  <div class="fld"><label for="c-cap">Sức chứa (cá thể)</label><input class="inp" id="c-cap" type="number" min="1" max="30" value="${ar.cap}"></div>
  <div class="fld"><label for="c-size">Diện tích (m²)</label><input class="inp" id="c-size" type="number" min="1" step="0.5" value="${ar.cap * 2}"></div>
  <div class="fld"><label for="c-st">Tình trạng ban đầu</label><select class="sel" id="c-st"><option>Trống</option><option>Đang vệ sinh</option></select></div>
  <div class="fld full"><label for="c-note">Ghi chú</label><input class="inp" id="c-note" placeholder="VD: có máng uống tự động, mái che phía Tây"></div>
  <div class="full" id="c-err" style="color:var(--bad);font-size:12.5px" hidden></div>
  <div class="full muted" style="font-size:12.5px">Mã chuồng được gợi ý theo khu. Sau khi lưu, hệ thống tạo mã QR để in thẻ chuồng.</div>`,
        `<button class="btn" data-act="close">Hủy</button><button class="btn pri" data-act="save-cage">${ic("check")}Lưu chuồng</button>`,
      );
    }

    // ---------- forms ----------
    const iso = (d) =>
      `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const parseD = (s) => (s ? new Date(s + "T00:00:00") : null);
    const val = (id) => ($("#" + id)?.value ?? "").trim();
    const files = (id) => [...($("#" + id)?.files || [])].map((f) => f.name);
    const checked = (name) =>
      [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(
        (x) => x.value,
      );
    const ME = "Phạm Thị Lan";
    function ferr(m) {
      const el = $("#f-err");
      el.textContent = m;
      el.hidden = false;
      el.scrollIntoView({ block: "nearest" });
      return false;
    }
    function addLog(a, o, c = "c-ok") {
      const n = new Date();
      LOG.unshift({
        t: `Hôm nay ${pad(n.getHours())}:${pad(n.getMinutes())}`,
        u: ME,
        a,
        o,
        c,
      });
    }
    function nextCode(prefix, list) {
      const re = new RegExp("^" + prefix.replace(/[-]/g, "\\-") + "(\\d+)$");
      const nums = list.map((c) => +(c.match(re)?.[1] || 0));
      const w = list.find((c) => re.test(c))?.match(re)[1].length || 3;
      return prefix + pad(Math.max(0, ...nums) + 1, w);
    }
    const fld = (label, inner, full) =>
      `<div class="fld${full ? " full" : ""}">${label ? `<label>${label}</label>` : ""}${inner}</div>`;
    const sel = (id, opts, cur) =>
      `<select class="sel" id="${id}">${opts
        .map((o) => {
          const [v, l] = Array.isArray(o) ? o : [o, o];
          return `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(l)}</option>`;
        })
        .join("")}</select>`;
    const dateIn = (id, d = TODAY, max = true) =>
      `<input class="inp" id="${id}" type="date" value="${d ? iso(d) : ""}" ${max ? `max="${iso(TODAY)}"` : ""}>`;
    function animalIn(id, preset, filter, listId = "dl-" + id) {
      const lst = animals.filter(filter || (() => true));
      return `<input class="inp mono" id="${id}" list="${listId}" placeholder="Gõ mã, ví dụ MF0012" value="${preset || ""}" ${preset ? "readonly" : ""} autocomplete="off"><datalist id="${listId}">${lst.map((a) => `<option value="${a.id}">${SP(a.sp).name} · ${a.sex} · ${a.cage}</option>`).join("")}</datalist>`;
    }
    function pickAnimal(id, label = "cá thể") {
      const raw = val(id).toUpperCase();
      const a = A(raw) || A("MF" + raw.replace(/\D/g, "").padStart(4, "0"));
      if (!raw) return ferr(`Chọn ${label}.`) && null;
      if (!a) return ferr(`Không tìm thấy ${label} có mã "${raw}".`) && null;
      return a;
    }
    function formModal(title, body, key, saveLabel = "Lưu") {
      return modal(
        title,
        body + `<div class="full ferr" id="f-err" role="alert" hidden></div>`,
        `<button class="btn" data-act="close">Hủy</button><button class="btn pri" data-act="fsave" data-k="${key}">${ic("check")}${saveLabel}</button>`,
      );
    }
    const cageOpts = (exclude) =>
      AREAS.map(
        (ar) =>
          `<optgroup label="${ar.name} – ${ar.desc}">${cages
            .filter(
              (c) =>
                c.area === ar.k && c.id !== exclude && c.animals.length < c.cap,
            )
            .map(
              (c) =>
                `<option value="${c.id}">${c.id} (${c.animals.length}/${c.cap})</option>`,
            )
            .join("")}</optgroup>`,
      ).join("");

    const FORMS = {
      exam: {
        open(d) {
          const a = d.id && A(d.id);
          return formModal(
            a ? `Ghi nhận khám – ${a.id}` : "Ghi nhận khám",
            fld("Cá thể *", animalIn("f-a", a?.id)) +
              fld("Ngày khám", dateIn("f-date")) +
              fld(
                "Loại khám",
                sel("f-type", [
                  "Khám bệnh",
                  "Khám định kỳ",
                  "Tái khám",
                  "Điều trị",
                ]),
              ) +
              fld("Bác sĩ", sel("f-vet", VETS, "BS. Phạm Thị Lan")) +
              fld(
                "Nhiệt độ (°C) *",
                `<input class="inp" id="f-temp" type="number" step="0.1" min="34" max="43" value="38.5">`,
              ) +
              fld(
                "Cân nặng (kg)",
                `<input class="inp" id="f-w" type="number" step="0.1" min="0.1" value="${a ? a.weight : ""}" placeholder="Để trống nếu không cân">`,
              ) +
              fld(
                "Chẩn đoán *",
                `<input class="inp" id="f-dx" list="dl-dx" placeholder="VD: Tiêu chảy cấp" autocomplete="off"><datalist id="dl-dx">${[...new Set(DX.map((x) => x[1]))].map((x) => `<option value="${x}">`).join("")}</datalist>`,
                true,
              ) +
              fld(
                "Điều trị / đơn thuốc",
                `<textarea class="inp" id="f-rx" placeholder="Tên thuốc, liều mg/kg, số ngày"></textarea>`,
                true,
              ) +
              fld(
                "Kết luận",
                sel("f-st", [
                  ["Đã xong", "Khỏe – kết thúc"],
                  ["Theo dõi", "Cần theo dõi"],
                  ["Đang điều trị", "Đang điều trị"],
                ]),
              ) +
              fld("Hẹn tái khám", dateIn("f-next", null, false)) +
              fld(
                "Ảnh / tệp đính kèm",
                `<input class="inp" id="f-file" type="file" multiple accept="image/*,.pdf">`,
                true,
              ),
            "exam",
            "Lưu hồ sơ khám",
          );
        },
        save() {
          const a = pickAnimal("f-a");
          if (!a) return false;
          const date = parseD(val("f-date"));
          if (!date || date > TODAY)
            return ferr("Ngày khám không hợp lệ (không được sau hôm nay).");
          const temp = parseFloat(val("f-temp"));
          if (!(temp >= 34 && temp <= 43))
            return ferr("Nhiệt độ cần trong khoảng 34–43 °C.");
          const type = val("f-type");
          const dx =
            val("f-dx") || (type === "Khám định kỳ" ? "Bình thường" : "");
          if (!dx) return ferr("Nhập chẩn đoán.");
          const w = parseFloat(val("f-w"));
          if (val("f-w") && !(w > 0 && w < 30))
            return ferr("Cân nặng không hợp lệ.");
          const st = val("f-st");
          const next = parseD(val("f-next"));
          if (next && next <= date)
            return ferr("Ngày tái khám phải sau ngày khám.");
          const fs = files("f-file");
          health.unshift({
            date,
            a: a.id,
            type,
            dx: esc(dx),
            rx: esc(val("f-rx")) || "—",
            st,
            vet: val("f-vet"),
            temp: temp.toFixed(1),
            files: fs,
          });
          health.sort((x, y) => y.date - x.date);
          if (w) a.weight = Math.round(w * 10) / 10;
          if (!["Cách ly", "Mang thai"].includes(a.status)) {
            if (st === "Đang điều trị") a.status = "Đang điều trị";
            else if (st === "Theo dõi") a.status = "Theo dõi";
            else if (["Đang điều trị", "Theo dõi"].includes(a.status))
              a.status = "Khỏe mạnh";
          }
          if (next) {
            SCHED.push({
              what: `Tái khám: ${esc(dx)}`,
              scope: `Cá thể ${a.id} · chuồng ${a.cage}`,
              due: next,
            });
            SCHED.sort((x, y) => x.due - y.due);
          }
          addLog("Thêm", `Hồ sơ khám ${a.id} – ${esc(dx)}`);
          return {
            msg: `Đã lưu hồ sơ khám ${a.id}${fs.length ? ` kèm ${fs.length} tệp` : ""}${next ? `, hẹn tái khám ${fd(next)}` : ""}`,
          };
        },
      },

      move: {
        open(d) {
          const a = d.id && A(d.id);
          return formModal(
            a ? `Chuyển chuồng – ${a.id}` : "Chuyển chuồng",
            fld("Cá thể *", animalIn("f-a", a?.id)) +
              fld(
                "Chuồng hiện tại",
                `<input class="inp mono" id="f-cur" readonly value="${a ? a.cage : "—"}">`,
              ) +
              fld(
                "Chuyển đến *",
                `<select class="sel" id="f-to"><option value="">Chọn chuồng còn chỗ</option>${cageOpts(a?.cage)}</select>`,
              ) +
              fld("Ngày chuyển", dateIn("f-date")) +
              fld(
                "Lý do",
                sel("f-reason", [
                  "Ghép đàn",
                  "Tách mẹ",
                  "Hết cách ly",
                  "Cách ly – nghi bệnh",
                  "Phân đàn sinh sản",
                  "Sửa chữa chuồng",
                  "Khác",
                ]),
              ) +
              fld(
                "Người thực hiện",
                sel(
                  "f-by",
                  STAFF.filter((s) => s.on).map((s) => s.name),
                  ME,
                ),
              ) +
              fld(
                "Ghi chú",
                `<input class="inp" id="f-note" placeholder="Tùy chọn">`,
                true,
              ) +
              `<div class="full fhint">Chuyển vào khu C sẽ đặt tình trạng cá thể thành <b>Cách ly</b>.</div>`,
            "move",
            "Xác nhận chuyển",
          );
        },
        save() {
          const a = pickAnimal("f-a");
          if (!a) return false;
          const to = cages.find((c) => c.id === val("f-to"));
          if (!to) return ferr("Chọn chuồng chuyển đến.");
          if (to.id === a.cage) return ferr("Cá thể đang ở chuồng này rồi.");
          if (to.animals.length >= to.cap)
            return ferr(`Chuồng ${to.id} đã đầy.`);
          const date = parseD(val("f-date"));
          if (!date || date > TODAY) return ferr("Ngày chuyển không hợp lệ.");
          const from = cages.find((c) => c.id === a.cage);
          from.animals = from.animals.filter((x) => x !== a.id);
          to.animals.push(a.id);
          const reason =
            val("f-reason") + (val("f-note") ? ` – ${val("f-note")}` : "");
          (a.moves = a.moves || []).unshift({
            date,
            from: from.id,
            to: to.id,
            reason,
            by: val("f-by"),
          });
          a.cage = to.id;
          a.area = to.area;
          if (to.area === "C") a.status = "Cách ly";
          else if (a.status === "Cách ly") a.status = "Khỏe mạnh";
          refreshCage(from);
          refreshCage(to);
          addLog("Điều chuyển", `${a.id}: ${from.id} → ${to.id}`, "c-pri");
          return { msg: `Đã chuyển ${a.id} từ ${from.id} sang ${to.id}` };
        },
      },

      clean: {
        open(d) {
          const one = d.k && cages.find((c) => c.id === d.k);
          const list = one
            ? fld(
                "Chuồng",
                `<input class="inp mono" readonly value="${one.id}"><input type="hidden" name="f-cages" value="${one.id}" checked>`,
              )
            : `<div class="fld full"><label>Chọn chuồng * <span class="muted" style="font-weight:400">(đã chọn sẵn các chuồng chưa vệ sinh hôm nay)</span></label><div class="checks scroll">${AREAS.map(
                (ar) =>
                  `<span class="grp-l">${ar.name} – ${ar.desc}</span>` +
                  cages
                    .filter((c) => c.area === ar.k)
                    .map(
                      (c) =>
                        `<label><input type="checkbox" name="f-cages" value="${c.id}" ${daysBetween(c.clean, TODAY) > 0 ? "checked" : ""}><span class="mono">${c.id}</span></label>`,
                    )
                    .join(""),
              ).join("")}</div></div>`;
          return formModal(
            one ? `Ghi nhận vệ sinh – ${one.id}` : "Ghi nhận vệ sinh chuồng",
            list +
              fld(
                "Người thực hiện",
                sel(
                  "f-by",
                  STAFF.filter((s) => s.on).map((s) => s.name),
                  "Huỳnh Văn Tuấn",
                ),
              ) +
              fld(
                "Thời gian",
                `<input class="inp" id="f-time" type="time" value="09:00">`,
              ) +
              `<div class="fld full"><label>Công việc đã làm *</label><div class="checks">${["Rửa nền", "Thay nước uống", "Khử trùng Benkocid 1:500", "Vệ sinh khay thức ăn", "Thay chất độn", "Diệt côn trùng"].map((t, i) => `<label><input type="checkbox" name="f-tasks" value="${t}" ${i < 2 ? "checked" : ""}>${t}</label>`).join("")}</div></div>` +
              fld(
                "Ghi chú",
                `<input class="inp" id="f-note" placeholder="VD: phát hiện rò nước ở máng uống">`,
                true,
              ),
            "clean",
            "Lưu nhật ký vệ sinh",
          );
        },
        save() {
          const ids = [...document.querySelectorAll('input[name="f-cages"]')]
            .filter((x) => x.type === "hidden" || x.checked)
            .map((x) => x.value);
          if (!ids.length) return ferr("Chọn ít nhất một chuồng.");
          const tasks = checked("f-tasks");
          if (!tasks.length) return ferr("Chọn ít nhất một công việc đã làm.");
          const by = val("f-by");
          const desc =
            tasks.join(", ") +
            (val("f-note") ? ` – ${esc(val("f-note"))}` : "") +
            ` (${val("f-time") || "—"})`;
          ids.forEach((id) => {
            const c = cages.find((x) => x.id === id);
            c.clean = TODAY;
            (c.logs = c.logs || []).unshift([TODAY, by, desc]);
            if (c.status === "Đang vệ sinh") c.status = "Trống";
          });
          addLog(
            "Thêm",
            `Nhật ký vệ sinh ${ids.length > 3 ? ids.length + " chuồng" : ids.join(", ")}`,
          );
          return { msg: `Đã ghi nhận vệ sinh ${ids.length} chuồng` };
        },
      },

      lab: {
        open() {
          return formModal(
            "Tạo phiếu xét nghiệm",
            fld("Cá thể *", animalIn("f-a")) +
              fld("Ngày lấy mẫu", dateIn("f-date")) +
              `<div class="fld full"><label>Xét nghiệm cần làm * <span class="muted" style="font-weight:400">(mỗi xét nghiệm tạo một phiếu)</span></label><div class="checks">${TESTS.map((t) => `<label><input type="checkbox" name="f-tests" value="${t}">${t}</label>`).join("")}</div></div>` +
              fld(
                "Loại mẫu",
                sel("f-sample", [
                  "Máu toàn phần (EDTA)",
                  "Huyết thanh",
                  "Phân",
                  "Dịch ngoáy họng",
                  "Không lấy mẫu (test da)",
                ]),
              ) +
              fld(
                "Nơi xét nghiệm",
                sel("f-lab", [
                  "Phòng XN nội bộ",
                  "Trung tâm Chẩn đoán Thú y TW",
                ]),
              ) +
              fld(
                "Người lấy mẫu",
                sel(
                  "f-by",
                  STAFF.filter((s) =>
                    ["Bác sĩ thú y", "Kỹ thuật viên xét nghiệm"].includes(
                      s.role,
                    ),
                  ).map((s) => s.name),
                  "Ngô Phương Thảo",
                ),
              ) +
              fld(
                "Ghi chú",
                `<input class="inp" id="f-note" placeholder="VD: nhịn ăn 12 giờ trước khi lấy máu">`,
              ),
            "lab",
            "Tạo phiếu",
          );
        },
        save() {
          const a = pickAnimal("f-a");
          if (!a) return false;
          const tests = checked("f-tests");
          if (!tests.length) return ferr("Chọn ít nhất một xét nghiệm.");
          const date = parseD(val("f-date"));
          if (!date || date > TODAY) return ferr("Ngày lấy mẫu không hợp lệ.");
          const codes = [];
          tests.forEach((t) => {
            const code = nextCode(
              "XN-26-",
              labs.map((l) => l.code),
            );
            codes.push(code);
            labs.unshift({
              code,
              a: a.id,
              test: t,
              date,
              res: "Chờ kết quả",
              lab: val("f-lab"),
              file: null,
              sample: val("f-sample"),
            });
          });
          labs.sort((x, y) => y.date - x.date);
          state.labF = "";
          addLog("Thêm", `Phiếu xét nghiệm ${codes.join(", ")} cho ${a.id}`);
          return {
            msg: `Đã tạo ${codes.length} phiếu xét nghiệm cho ${a.id}: ${codes.join(", ")}`,
          };
        },
      },

      labres: {
        open(d) {
          const l = labs.find((x) => x.code === d.k);
          const opts = ["Huyết học (CBC)", "Sinh hóa máu"].includes(l.test)
            ? ["Bình thường", "Bất thường nhẹ"]
            : ["Âm tính", "Dương tính"];
          return formModal(
            `Nhập kết quả – ${l.code}`,
            `<div class="full kv"><div><small>Cá thể</small><span class="mono">${l.a}</span></div><div><small>Xét nghiệm</small><span>${l.test}</span></div><div><small>Ngày lấy mẫu</small><span>${fd(l.date)}</span></div><div><small>Nơi xét nghiệm</small><span>${l.lab}</span></div></div>` +
              `<input type="hidden" id="f-code" value="${l.code}">` +
              fld("Kết quả *", sel("f-res", opts)) +

    function permSummary(role) {
      const p = perms[role];
      const can = (i) => MODULES.filter((m) => p[m][i]);
      const edit = can(2);
      return `Quyền mặc định của <b>${role}</b>: xem ${can(0).length}/${MODULES.length} phân hệ${edit.length ? `, sửa: ${edit.join(", ")}` : ", không được sửa dữ liệu"}${can(3).length ? ", có quyền xóa" : ", không có quyền xóa"}. Điều chỉnh ở Ma trận phân quyền.`;
    }
    function slug(name) {
      const w = name
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .replace(/đ/g, "d")
        .replace(/Đ/g, "D")
        .toLowerCase()
        .split(/\s+/)
        .filter(Boolean);
      if (w.length < 2) return w[0] || "";
      return (
        w[w.length - 1] +
        "." +
        w
          .slice(0, -1)
          .map((x) => x[0])
          .join("")
      );
    }

      let inner;

        inner = (

            dashboard: pDashboard,

          c.textContent = `${filtered().length} / ${animals.length} cá thể`;

    let lastRoute = "";

      const r = location.hash.slice(1);

        state.tab = "tong-quan";
      lastRoute = r;
      closeModal();
      render();
      window.scrollTo(0, 0);
    });

    document.addEventListener("click", (e) => {
      const go = e.target.closest("[data-go]");
      const act = e.target.closest("[data-act]");
      if (act && act.tagName !== "INPUT" && act.tagName !== "SELECT") {
        const k = act.dataset.act,
          d = act.dataset;
        if (k === "bg" && e.target !== act) return;
        if (k.startsWith("f-") && FORMS[k.slice(2)]) {
          e.preventDefault();
          openModal(FORMS[k.slice(2)].open(d));
          if (k === "f-staff")
            $("#f-perm").innerHTML = permSummary(val("f-role"));
          const first = document.querySelector(
            "#mdl .mb input:not([readonly]):not([type=hidden]):not([type=checkbox]), #mdl .mb select",
          );
          first?.focus();
          return;
        }
        switch (k) {
          case "txf":
            state.txF = d.k;
            render();
            return;
          case "tx-open":
            openModal(txModal(d.k));
            return;
          case "tx-next": {
            const x = TX.find((t) => t.code === d.k);
            if (!x.log)
              x.log = TX_ST.map((_, i) =>
                i <= x.st ? fd(addDays(x.date, -9 + i * 3)) : null,
              );
            x.st++;
            x.log[x.st] = fd(TODAY);
            addLog(
              x.st === 3 ? "Hoàn tất" : "Duyệt",
              `Phiếu ${x.code} → ${TX_ST[x.st]}`,
              x.st === 3 ? "c-ok" : "c-pri",
            );
            render();
            openModal(txModal(x.code));
            toast(`Phiếu ${x.code}: ${TX_ST[x.st]}`);
            return;
          }
          case "fsave": {
            const res = FORMS[d.k].save();
            if (!res) return;
            closeModal();
            render();
            toast(res.msg);
            return;
          }
          case "mob-save": {
            const a = A(d.id);
            const m = state.mob;
            const ok = m.st === "Bình thường";
            health.unshift({
              date: TODAY,
              a: a.id,
              type: "Khám nhanh (mobile)",
              dx: m.st,
              rx: "—",
              st: ok ? "Đã xong" : "Theo dõi",
              vet: "BS. Phạm Thị Lan",
              temp: m.t.toFixed(1),
            });
            a.weight = m.w;
            if (!ok && a.status === "Khỏe mạnh") a.status = "Theo dõi";
            addLog("Thêm", `Khám nhanh trên điện thoại: ${a.id} – ${m.st}`);
            render();
            toast(
              `Đã lưu ghi nhận khám ${a.id}: ${m.st}, ${m.w.toFixed(1)} kg, ${m.t.toFixed(1)}°C. Xem ở mục Sức khỏe.`,
            );
            return;
          }
          case "open-side":
            $("#side").classList.add("open");
            $("#scrim").classList.add("open");
            return;
          case "close-side":
            $("#side").classList.remove("open");
            $("#scrim").classList.remove("open");
            return;
          case "toast":
            e.preventDefault();
            toast(d.msg);
            return;
          case "add":
            openModal(addModal());
            return;
          case "add-cage":
            openModal(addCageModal());
            $("#c-id").focus();
            return;
          case "save-cage": {
            const err = (m) => {
              const el = $("#c-err");
              el.textContent = m;
              el.hidden = false;
            };
            const area = $("#c-area").value;
            const id = $("#c-id").value.trim().toUpperCase();
            const cap = parseInt($("#c-cap").value, 10);
            if (!/^[A-Z]-\d{2,3}$/.test(id))
              return err("Mã chuồng cần có dạng Khu-Số, ví dụ A-11.");
            if (id[0] !== area)
              return err(
                `Mã chuồng phải bắt đầu bằng chữ của khu đã chọn (${area}).`,
              );
            if (cages.some((c) => c.id === id))
              return err(
                `Mã ${id} đã tồn tại. Hãy chọn mã khác, ví dụ ${nextCageId(area)}.`,
              );
            if (!(cap >= 1 && cap <= 30))
              return err("Sức chứa cần từ 1 đến 30 cá thể.");
            cages.push({
              id,
              area,
              cap,
              type: $("#c-type").value,
              animals: [],
              clean: TODAY,
              built: TODAY.getFullYear(),
              status: $("#c-st").value,
            });
            cages.sort(
              (x, y) =>
                x.area.localeCompare(y.area) || +x.id.slice(2) - +y.id.slice(2),
            );
            state.cageArea = area;
            closeModal();
            render();
            toast(
              `Đã thêm chuồng ${id} vào ${AREAS.find((a) => a.k === area).name}`,
            );
            return;
          }
          case "close":
          case "bg":
            closeModal();
            return;
          case "tab":
            state.tab = d.k;
            render();
            return;
          case "carea":
            state.cageArea = d.k;
            render();
            return;
          case "cage":
            openModal(cageModal(d.k));
            return;
          case "labf":
            state.labF = d.k;
            render();
            return;
          case "rpt":
            state.rpt = d.k;
            render();
            toast("Đã cập nhật kỳ báo cáo (demo)");
            return;
          case "mst":
            state.mob.st = d.k;
            render();
            return;
          case "mw":
            state.mob.w = Math.max(
              0.3,
              Math.round((state.mob.w + +d.d) * 10) / 10,
            );
            render();
            return;
          case "mt":
            state.mob.t = Math.round((state.mob.t + +d.d) * 10) / 10;
            render();
            return;
          case "infants":
            state.q = "";
            state.st = "";
            state.area = "B";
            return;
          case "theme": {
            const rt = document.documentElement;
            const dark = rt.dataset.theme
              ? rt.dataset.theme === "dark"
              : matchMedia("(prefers-color-scheme: dark)").matches;
            rt.dataset.theme = dark ? "light" : "dark";
            return;
          }
          case "save-new": {
            const cage = cages.find((c) => c.id === $("#n-c").value);
            const sp = $("#n-sp").value;
            const o = $("#n-o").value;
            const b = new Date($("#n-b").value || "2022-05-10");
            const n = animals.length + 1;
            const a = {
              idx: n,
              id: `MF${pad(n, 4)}`,
              sp,
              sex: $("#n-sex").value,
              birth: b,
              received: o === "Sinh tại trại" ? b : TODAY,
              bornHere: o === "Sinh tại trại",
              origin: o,
              cage: cage.id,
              area: cage.area,
              status: cage.area === "C" ? "Cách ly" : "Khỏe mạnh",
              chip:
                ($("#n-chip").value || "").replace(/\D/g, "").slice(0, 15) ||
                "—",
              tattoo: `${sp.toUpperCase()}-${pad(n % 1000, 3)}`,
              weight: parseFloat($("#n-w").value) || 4,
              mother: null,
              father: null,
              added: true,
            };
            animals.push(a);
            cage.animals.push(a.id);
            closeModal();
            toast(`Đã tạo hồ sơ ${a.id}`);
            location.hash = `ho-so-${a.idx}`;
            return;
          }
        }
      }
      if (go) {
        e.preventDefault();
        location.hash = go.dataset.go;
      }
    });
    document.addEventListener("change", (e) => {
      const t = e.target;
      if (t.closest("#mdl")) $("#f-err") && ($("#f-err").hidden = true);
      if (t.id === "f-a" && $("#f-cur")) {
        const a = A(t.value.trim().toUpperCase());
        $("#f-cur").value = a ? a.cage : "—";
        $("#f-to").innerHTML =
          `<option value="">Chọn chuồng còn chỗ</option>${cageOpts(a?.cage)}`;
      }
      if (t.id === "f-mdate") {
        const d = parseD(t.value);
        $("#f-due").innerHTML = d
          ? `Dự sinh (≈165 ngày): <b>${fd(addDays(d, 165))}</b> · hiện ở ngày ${daysBetween(d, TODAY)} của thai kỳ`
          : "";
      }
      if (t.id === "f-type" && $("#f-txhint")) {
        const pre = {
          Nhập: "PN-2026-",
          Xuất: "PX-2026-",
          "Điều chuyển": "DC-2026-",
        }[t.value];
        $("#f-code").value = nextCode(
          pre,
          TX.map((x) => x.code),
        );
        $("#mdl .mh h3").textContent = `Tạo phiếu ${t.value.toLowerCase()}`;
        $("#f-txhint").textContent =
          t.value === "Xuất"
            ? "Phiếu xuất cần giấy phép CITES xuất khẩu và giấy kiểm dịch trước khi duyệt."
            : t.value === "Nhập"
              ? "Cá thể nhập sẽ vào khu C cách ly 31 ngày sau khi phiếu hoàn tất."
              : "Phiếu điều chuyển nội bộ cần quản lý trại duyệt.";
      }
      if (t.id === "f-noexp") $("#f-exp").disabled = t.checked;
      if (t.id === "f-role" && $("#f-perm"))
        $("#f-perm").innerHTML = permSummary(t.value);
      if (t.id === "c-area") {
        const ar = AREAS.find((a) => a.k === t.value);
        $("#c-id").value = nextCageId(ar.k);
        $("#c-type").value = ar.type;
        $("#c-cap").value = ar.cap;
        $("#c-size").value = ar.cap * 2;
        $("#c-err").hidden = true;
      }
      if (t.dataset.f) {
        state[t.dataset.f] = t.value;
        $("#rows").innerHTML = rowsHTML();
      }
      if (t.dataset.act === "task") {
        state.tasks[t.dataset.k] = t.checked;
        render();
      }
      if (t.dataset.act === "role") {
        state.role = t.value;
        render();
      }
      if (t.dataset.act === "perm") {
        perms[state.role][t.dataset.m][+t.dataset.i] = t.checked ? 1 : 0;
        toast(
          `${t.checked ? "Đã cấp" : "Đã thu hồi"} quyền "${["Xem", "Thêm", "Sửa", "Xóa"][+t.dataset.i]}" – ${t.dataset.m} cho ${state.role}`,
        );
      }
    });
    document.addEventListener("input", (e) => {
      if (e.target.id === "txq") {
        state.txQ = e.target.value;
        $("#txrows").innerHTML = txRows();
      }
      if (e.target.id === "f-user") e.target.dataset.touched = "1";
      if (
        e.target.id === "f-name" &&
        $("#f-user") &&
        !$("#f-user").dataset.touched
      ) {
        let s = slug(e.target.value),
          u = s,
          i = 2;
        while (STAFF.some((x) => x.u === u)) u = s + i++;
        $("#f-user").value = u;
      }
      if (e.target.id === "fq") {
        state.q = e.target.value;
        $("#rows").innerHTML = rowsHTML();
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
      if (
        e.key === "Enter" &&
        (e.target.id === "gq" || e.target.id === "m-q")
      ) {
        const q = e.target.value.trim().toLowerCase();
        if (!q) return;
        const hit = animals.find(
          (a) =>
            a.id.toLowerCase() === q ||
            a.chip === q ||
            a.id.toLowerCase() === "mf" + q.replace(/\D/g, "").padStart(4, "0"),
        );
        if (hit) {
          location.hash = `ho-so-${hit.idx}`;
        } else {
          state.q = e.target.value.trim();
          state.sp = state.sex = state.st = state.area = "";
          location.hash = "ca-the";
          if (location.hash === "#ca-the") render();
        }
      }
    });
    document.addEventListener("submit", (e) => {
      if (e.target.id === "login-form") {
        e.preventDefault();
        toast("Đăng nhập thành công");
        location.hash = "dashboard";
      }
    });

    lastRoute = location.hash.slice(1);
    render();
  })();
</script>
